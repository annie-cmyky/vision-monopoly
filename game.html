/* ==================================================
   選擇人數
   ================================================== */

function selectPlayerCount(count){

    totalPlayers = count;

    document.querySelectorAll(
        ".playerCountButton"
    ).forEach(button=>{
        button.classList.remove("selected");
    });

    document.querySelectorAll(
        ".playerCountButton"
    )[count-2].classList.add("selected");

    const settings =
        document.getElementById("playerSettings");

    settings.innerHTML = "";

    players = [];

    // 玩家1固定真人
    players.push({
        name:"玩家1",
        type:"human",
        position:0,
        icon:playerIcons[0],
        badges:[0,0,0,0],
        rest:false
    });

    const p1 =
        document.createElement("div");

    p1.className="playerSetting";
    p1.innerHTML="玩家1 👤 真人（固定）";

    settings.appendChild(p1);


    // 玩家2～4
    for(let i=2;i<=count;i++){

        players.push({
            name:"玩家"+i,
            type:"bot",
            position:0,
            icon:playerIcons[i-1],
            badges:[0,0,0,0],
            rest:false
        });

        const div =
            document.createElement("div");

        div.className="playerSetting";

        div.innerHTML =
            "玩家"+i+"："+

            "👤 真人</button>"+
            "<button onclick=\"setPlayerType("+
            i+",'bot',this)\">"+
            "🤖 電腦</button>";

        settings.appendChild(div);

        div.querySelectorAll("button")[1]
            .classList.add("selected");
    }

    document.getElementById(
        "startGameButton"
    ).style.display="inline-block";
}


/* ==================================================
   玩家身分
   ================================================== */

function setPlayerType(
    playerNumber,
    type,
    button
){

    players[playerNumber-1].type=type;

    button.parentElement
        .querySelectorAll("button")
        .forEach(b=>{
            b.classList.remove("selected");
        });

    button.classList.add("selected");
}


/* ==================================================
   開始遊戲
   ================================================== */

function startGame(){

    if(totalPlayers===0)return;

    document.getElementById(
        "setupScreen"
    ).style.display="none";

    document.getElementById(
        "gameScreen"
    ).style.display="block";

    currentPlayerIndex=0;
    gameEnded=false;

    updateBoard();
    updateBadgeInfo();
    updateTurnInfo();
}


/* ==================================================
   更新棋盤
   ================================================== */

function updateBoard(){

    for(let i=0;i<24;i++){

        const cell =
            document.getElementById("cell"+i);

        if(cell){
            const area =
                cell.querySelector(".players");

            if(area)area.innerHTML="";
        }
    }

    players.forEach(player=>{

        const cell =
            document.getElementById(
                "cell"+player.position
            );

        if(!cell)return;

        const area =
            cell.querySelector(".players");

        const span =
            document.createElement("span");

        span.className="player";
        span.textContent=player.icon;
        span.title=player.name;

        area.appendChild(span);
    });
}


/* ==================================================
   徽章顯示
   ================================================== */

function updateBadgeInfo(){

    let text="";

    players.forEach(player=>{

        text +=
            player.icon+" "+
            player.name+"： ";

        for(let i=0;i<4;i++){

            text +=
                badgeNames[i]+" ×"+
                player.badges[i];

            if(i<3)text+="　";
        }

        text+="<br>";
    });

    document.getElementById(
        "badgeInfo"
    ).innerHTML=text;
}


/* ==================================================
   回合資訊
   ================================================== */

function updateTurnInfo(){

    if(gameEnded)return;

    const player =
        players[currentPlayerIndex];

    const icon =
        player.type==="human"
        ? "👤"
        : "🤖";

    document.getElementById(
        "turnInfo"
    ).textContent =
        icon+" "+player.name+" 的回合";

    const rollButton =
        document.getElementById("rollButton");

    if(player.type==="human"){

        rollButton.disabled=false;

    }else{

        rollButton.disabled=true;

        setTimeout(()=>{
            if(!gameEnded)rollDice();
        },1000);
    }
}


/* ==================================================
   擲骰子
   ================================================== */

function rollDice(){

    if(gameEnded)return;

    const player =
        players[currentPlayerIndex];

    const dice =
        Math.floor(Math.random()*6)+1;

    document.getElementById(
        "diceResult"
    ).textContent =
        player.name+
        " 擲出了 "+
        dice+" 點！";

    player.position += dice;

    if(player.position>=24){
        player.position-=24;
    }

    updateBoard();

    checkCell();
}

/* ==================================================
   抽卡
   ================================================== */

function drawCard(){

    if(gameEnded)return;

    if(Math.random()<0.5){

        drawEventCard();

    }else{

        drawQuizCard();

    }
}


/* ==================================================
   普通事件卡
   ================================================== */

function drawEventCard(){

    const player =
        players[currentPlayerIndex];

    const card =
        eventCards[
            Math.floor(
                Math.random()*eventCards.length
            )
        ];

    document.getElementById(
        "cardTitle"
    ).textContent="🎴 事件";

    document.getElementById(
        "cardContent"
    ).textContent=card.text;

    document.getElementById(
        "quizOptions"
    ).style.display="none";

    document.getElementById(
        "cardOverlay"
    ).style.display="flex";


    // 執行事件效果
    setTimeout(()=>{

        if(gameEnded)return;

        if(card.effect==="move"){

            player.position += card.value;

            if(player.position>=24){
                player.position %= 24;
            }

            document.getElementById(
                "cardContent"
            ).textContent =
                card.text+
                "\n\n➡️ 前進 "+
                card.value+" 格！";

            updateBoard();

        }

        else if(card.effect==="back"){

            player.position -= card.value;

            if(player.position<0){
                player.position += 24;
            }

            document.getElementById(
                "cardContent"
            ).textContent =
                card.text+
                "\n\n⬅️ 後退 "+
                card.value+" 格！";

            updateBoard();

        }

        else if(card.effect==="rest"){

            player.rest=true;

            document.getElementById(
                "cardContent"
            ).textContent =
                card.text+
                "\n\n💤 下一回合休息一次！";
        }


        // BOT自動關閉
        if(player.type==="bot"){

            setTimeout(()=>{
                closeCard();
            },1200);

        }

    },500);
}


/* ==================================================
   問答卡
   ================================================== */

function drawQuizCard(){

    const player =
        players[currentPlayerIndex];

    currentQuiz =
        quizCards[
            Math.floor(
                Math.random()*quizCards.length
            )
        ];

    document.getElementById(
        "cardTitle"
    ).textContent =
        "❓ "+badgeNames[currentQuiz.type]+"問答";

    document.getElementById(
        "cardContent"
    ).textContent =
        currentQuiz.question;

    document.getElementById(
        "quizOptions"
    ).style.display="block";

    document.getElementById(
        "quizResult"
    ).textContent="";

    for(let i=0;i<4;i++){

        const button =
            document.getElementById(
                "answer"+i
            );

        button.style.display="block";

        button.textContent =
            String.fromCharCode(65+i)+
            ". "+
            currentQuiz.options[i];
    }

    document.getElementById(
        "cardOverlay"
    ).style.display="flex";


    // BOT自動回答
    if(player.type==="bot"){

        setTimeout(()=>{

            const answer =
                Math.floor(Math.random()*4);

            checkAnswer(answer);

        },1000);
    }
}


/* ==================================================
   判斷答案
   ================================================== */

function checkAnswer(index){

    if(!currentQuiz)return;

    const player =
        players[currentPlayerIndex];

    if(index===currentQuiz.answer){

        player.badges[
            currentQuiz.type
        ]++;

        document.getElementById(
            "quizResult"
        ).textContent =
            "🎉 答對了！獲得「"+
            badgeNames[currentQuiz.type]+
            "」徽章 ×1";

        updateBadgeInfo();

        // 檢查勝利
        if(checkWin(player)){

            setTimeout(()=>{
                closeCard();
                showWin(player);
            },1200);

            return;
        }

    }else{

        document.getElementById(
            "quizResult"
        ).textContent =
            "❌ 答錯了！沒有懲罰。";
    }


    // 隱藏選項
    for(let i=0;i<4;i++){

        document.getElementById(
            "answer"+i
        ).style.display="none";
    }


    // BOT自動關閉
    if(player.type==="bot"){

        setTimeout(()=>{
            closeCard();
        },1200);
    }
}


/* ==================================================
   勝利判定
   ================================================== */

function checkWin(player){

    // 條件一：
    // 四種類型各至少一個

    const allTypes =
        player.badges.every(
            badge=>badge>=1
        );

    if(allTypes)return true;


    // 條件二：
    // 任一類型達到4個

    const sameType =
        player.badges.some(
            badge=>badge>=4
        );

    if(sameType)return true;

    return false;
}


/* ==================================================
   顯示勝利畫面
   ================================================== */

function showWin(player){

    gameEnded=true;

    document.getElementById(
        "rollButton"
    ).disabled=true;

    document.getElementById(
        "winnerName"
    ).textContent =
        player.icon+
        " "+player.name+" 獲勝！";

    let text="";

    for(let i=0;i<4;i++){

        text +=
            badgeNames[i]+
            " × "+
            player.badges[i]+
            "<br>";
    }

    document.getElementById(
        "winBadges"
    ).innerHTML=text;

    document.getElementById(
        "winOverlay"
    ).style.display="flex";
}


/* ==================================================
   關閉卡片
   ================================================== */

function closeCard(){

    if(gameEnded)return;

    document.getElementById(
        "cardOverlay"
    ).style.display="none";

    document.getElementById(
        "quizResult"
    ).textContent="";

    currentQuiz=null;

    nextTurn();
}


/* ==================================================
   下一回合
   ================================================== */

function nextTurn(){

    if(gameEnded)return;

    currentPlayerIndex++;

    if(
        currentPlayerIndex>=players.length
    ){
        currentPlayerIndex=0;
    }


    const player =
        players[currentPlayerIndex];


    // 休息效果
    if(player.rest){

        player.rest=false;

        document.getElementById(
            "diceResult"
        ).textContent =
            player.name+
            " 本回合休息，不用擲骰子。";

        currentPlayerIndex++;

        if(
            currentPlayerIndex>=players.length
        ){
            currentPlayerIndex=0;
        }
    }

    updateTurnInfo();
}

</script>
